name: Youversly
options:
  bundleIdPrefix: app.youversly
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    SWIFT_APPROACHABLE_CONCURRENCY: YES
    SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
    CODE_SIGN_STYLE: Automatic
targets:
  Youversly:
    type: application
    platform: iOS
    sources:
      - path: Youversly
      # Bible data is shared with the web app; the files are referenced in place.
      - path: ../../packages/bible/src/en/kjv.json
        buildPhase: resources
      - path: ../../packages/bible/src/en/asv.json
        buildPhase: resources
      - path: ../../packages/bible/src/en/net.json
        buildPhase: resources
    info:
      path: Youversly/Info.plist
      properties:
        CFBundleDisplayName: Youversly
        CFBundleShortVersionString: "1.0.0"
        CFBundleVersion: "1"
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSPhotoLibraryAddUsageDescription: Youversly saves the verse posters you create to your photo library.
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.youversly.ios
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        SWIFT_EMIT_LOC_STRINGS: YES
  YouverslyTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: YouverslyTests
    dependencies:
      - target: Youversly
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: app.youversly.ios.tests
schemes:
  Youversly:
    build:
      targets:
        Youversly: all
        YouverslyTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - YouverslyTests
